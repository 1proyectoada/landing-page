<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <!-- The color is hard-coded here because a CSS background SVG cannot read CSS variables. -->
    <!-- The shared center sits at the section edge, so only half of each ring is visible;
         the CSS mirroring puts that half on the right in the mirrored section. -->
    <defs>
        <circle id="wave" cx="0" cy="0" r="30"
                fill="none" stroke="#7447e1" stroke-width="1.5"
                stroke-linecap="round" vector-effect="non-scaling-stroke" />
    </defs>
    <use href="#wave" transform="translate(73 200) scale(1)" />
    <use href="#wave" transform="translate(73 200) scale(2)" />
    <use href="#wave" transform="translate(73 200) scale(3)" />
    <use href="#wave" transform="translate(73 200) scale(4)" />
    <use href="#wave" transform="translate(73 200) scale(5)" />
    <use href="#wave" transform="translate(73 200) scale(6)" />
</svg>
