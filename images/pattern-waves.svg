<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <!-- The color is hard-coded here because a CSS background SVG cannot read CSS variables. -->
    <!-- One arc is reused with <use>: the shared translate keeps every center off-canvas,
         while scale() grows the radius; vector-effect holds the stroke at 1.5px. -->
    <defs>
        <path id="wave" d="M 0 -100 A 100 100 0 0 1 0 100"
              fill="none" stroke="#7447e1" stroke-width="1.5"
              stroke-linecap="round" vector-effect="non-scaling-stroke" />
    </defs>
    <use href="#wave" transform="translate(-140 200) scale(1.3)" />
    <use href="#wave" transform="translate(-140 200) scale(1.6)" />
    <use href="#wave" transform="translate(-140 200) scale(1.9)" />
    <use href="#wave" transform="translate(-140 200) scale(2.2)" />
    <use href="#wave" transform="translate(-140 200) scale(2.5)" />
    <use href="#wave" transform="translate(-140 200) scale(2.8)" />
    <use href="#wave" transform="translate(-140 200) scale(3.1)" />
    <use href="#wave" transform="translate(-140 200) scale(3.4)" />
</svg>
